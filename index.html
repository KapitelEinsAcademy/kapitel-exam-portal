<!DOCTYPE html>
<html lang="de" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kapitel Eins Sprachakademie - Prüfungsportal</title>
    <style>
        :root {
            --primary-color: #ea580c;
            --secondary-color: #c2410c;
            --text-color: #1e293b;
            --bg-gradient: linear-gradient(135deg, #f97316 0%, #ea580c 50%, #c2410c 100%);
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            position: relative;
            background: var(--bg-gradient);
        }
        body::before {
            content: "Kapitel Eins Sprachakademie";
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-25deg);
            font-size: 8vw;
            font-weight: 900;
            color: rgba(255, 255, 255, 0.12);
            white-space: nowrap;
            z-index: 0;
            pointer-events: none;
        }
        .container {
            width: 100%;
            max-width: 750px;
            background: linear-gradient(rgba(255, 255, 255, 0.72), rgba(255, 255, 255, 0.72)), url('./logo.jpg') center center / auto 100% no-repeat;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            position: relative;
            z-index: 1;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 20px;
        }
        .academy-logo {
            max-height: 90px;
            max-width: 240px;
            width: auto;
            height: auto;
            object-fit: contain;
            display: block;
            margin: 0 auto 14px auto;
            border-radius: 10px;
        }
        .header h1 {
            color: var(--primary-color);
            font-size: 28px;
            margin: 0 0 10px 0;
        }
        .pre-recorder-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px 20px;
            margin-bottom: 20px;
        }
        .pre-recorder-grid .form-group {
            margin-bottom: 0;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: var(--text-color);
        }
        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            background-color: rgba(255, 255, 255, 0.96);
            color: var(--text-color);
        }
        .criteria-box {
            background: rgba(248, 250, 252, 0.95);
            border: 1px solid #cbd5e1;
            padding: 20px;
            border-radius: 12px;
            margin-top: 25px;
            margin-bottom: 25px;
        }
        .criteria-box h3 {
            margin-top: 0;
            color: var(--primary-color);
            font-size: 18px;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 10px;
        }
        .criteria-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .criteria-row label {
            margin-bottom: 0;
            font-weight: normal;
            font-size: 14px;
            flex: 2;
        }
        .criteria-row select {
            flex: 1;
            padding: 8px;
        }
        .total-box {
            background: rgba(241, 245, 249, 0.97);
            border: 2px solid #94a3b8;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
            color: #475569;
            font-size: 18px;
            transition: background-color 0.25s ease, border-color 0.25s ease, color 0.25s ease;
        }
        .total-box.score-pass {
            background: rgba(220, 252, 231, 0.98);
            border-color: #16a34a;
            color: #166534;
        }
        .total-box.score-fail {
            background: rgba(254, 226, 226, 0.98);
            border-color: #dc2626;
            color: #991b1b;
        }
        .recorder-section {
            background: rgba(248, 250, 252, 0.95);
            border: 2px dashed #cbd5e1;
            padding: 20px;
            border-radius: 12px;
            margin-top: 25px;
            margin-bottom: 25px;
            text-align: center;
        }
        .btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 15px;
            border-radius: 8px;
            cursor: pointer;
            margin: 5px;
            font-weight: bold;
            transition: background 0.3s;
        }
        .btn:hover { background: var(--secondary-color); }
        .btn-warning { background: #f59e0b; color: white; }
        .btn-warning:hover { background: #d97706; }
        .btn-danger { background: #ef4444; }
        .btn-danger:hover { background: #dc2626; }
        .btn-success { background: #10b981; }
        .btn-success:hover { background: #059669; }
        .btn:disabled, .btn-success:disabled { background: #cbd5e1; cursor: not-allowed; }
        #audioElement { display: none; }
        #statusMessage {
            margin-top: 15px;
            font-weight: bold;
            text-align: center;
        }
        @media (max-width: 650px) {
            .pre-recorder-grid {
                grid-template-columns: 1fr;
            }
            .container {
                padding: 24px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <img src="./logo.jpg" alt="Kapitel Eins Sprachakademie Logo" class="academy-logo">
            <h1>Kapitel Eins Sprachakademie</h1>
            <p>Prüfungsanmeldung & Mündliche Prüfung</p>
        </div>

        <form id="examForm">
            <div class="pre-recorder-grid">
                <div class="form-group">
                    <label for="fullName">Vollständiger Name:</label>
                    <input type="text" id="fullName" required>
                </div>

                <div class="form-group">
                    <label for="idNumber">ID / Nummer:</label>
                    <input type="text" id="idNumber" required>
                </div>

                <div class="form-group">
                    <label for="examType">Test-Art:</label>
                    <select id="examType" required>
                        <option value="" disabled selected></option>
                        <option value="Einstufungstest">Einstufungstest</option>
                        <option value="Final Test">Final Test</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="examMode">Prüfungsmodus (Online / Offline):</label>
                    <select id="examMode" required>
                        <option value="" disabled selected></option>
                        <option value="Online">Online</option>
                        <option value="Offline">Offline</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="examAttempt">Prüfungsversuch:</label>
                    <select id="examAttempt" required>
                        <option value="" disabled selected></option>
                        <option value="Erstes Mal">Erstes Mal</option>
                        <option value="Wiederholung">Wiederholung</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="examDate">Prüfungsdatum:</label>
                    <input type="date" id="examDate" required>
                </div>

                <div class="form-group">
                    <label for="instructor">Prüfer / Instructor:</label>
                    <input type="text" id="instructor" required>
                </div>

                <div class="form-group">
                    <label for="examLevel">Prüfungsniveau:</label>
                    <select id="examLevel" required>
                        <option value="" disabled selected></option>
                        <option value="A1.1">A1.1</option>
                        <option value="A1.2">A1.2</option>
                        <option value="A2.1">A2.1</option>
                        <option value="A2.2">A2.2</option>
                        <option value="B1.1">B1.1</option>
                        <option value="B1.2">B1.2</option>
                        <option value="B2.1">B2.1</option>
                        <option value="B2.2">B2.2</option>
                        <option value="C1.1">C1.1</option>
                        <option value="C1.2">C1.2</option>
                        <option value="C2.1">C2.1</option>
                        <option value="C2.2">C2.2</option>
                        <option value="Konv Nach A2">Konv Nach A2</option>
                        <option value="Konv Nach B1">Konv Nach B1</option>
                        <option value="Konv Nach B2">Konv Nach B2</option>
                        <option value="Beratung A1">Beratung A1</option>
                        <option value="Beratung A2">Beratung A2</option>
                        <option value="Beratung B1">Beratung B1</option>
                        <option value="Beratung B2">Beratung B2</option>
                        <option value="Beratung C1">Beratung C1</option>
                        <option value="Beratung C2">Beratung C2</option>
                    </select>
                </div>
            </div>

            <div class="recorder-section">
                <label>Mündliche Prüfung (Audioaufnahme):</label>
                <p style="font-size: 13px; color: #64748b; margin-top: 2px;">للامتحان أونلاين على الكمبيوتر: اختر "مشاركة الصوت (Share tab audio)". على الموبايل: يتم التسجيل عبر الميكروفون مباشرة.</p>
                <button type="button" id="startBtn" class="btn">🎙️ Start</button>
                <button type="button" id="pauseBtn" class="btn btn-warning" disabled>⏸️ Pause</button>
                <button type="button" id="stopBtn" class="btn btn-danger" disabled>⏹️ Stopp & Fertig</button>
                <p id="timer" style="margin-top: 10px; font-weight: bold; color: #64748b;">00:00</p>
                <audio id="audioElement" controls></audio>
            </div>

            <div class="criteria-box">
                <h3>Bewertungskriterien (0 bis 5)</h3>
                
                <div class="criteria-row">
                    <label>Erfüllung (E):</label>
                    <select id="critE" class="score-select" required>
                        <option value="" disabled selected></option>
                        <option value="0">0</option>
                        <option value="0.5">0.5</option>
                        <option value="1">1</option>
                        <option value="1.5">1.5</option>
                        <option value="2">2</option>
                        <option value="2.5">2.5</option>
                        <option value="3">3</option>
                        <option value="3.5">3.5</option>
                        <option value="4">4</option>
                        <option value="4.5">4.5</option>
                        <option value="5">5</option>
                    </select>
                </div>

                <div class="criteria-row">
                    <label>Wortschatz und Redemittel (W/R):</label>
                    <select id="critWR" class="score-select" required>
                        <option value="" disabled selected></option>
                        <option value="0">0</option>
                        <option value="0.5">0.5</option>
                        <option value="1">1</option>
                        <option value="1.5">1.5</option>
                        <option value="2">2</option>
                        <option value="2.5">2.5</option>
                        <option value="3">3</option>
                        <option value="3.5">3.5</option>
                        <option value="4">4</option>
                        <option value="4.5">4.5</option>
                        <option value="5">5</option>
                    </select>
                </div>

                <div class="criteria-row">
                    <label>Aussprache (A):</label>
                    <select id="critA" class="score-select" required>
                        <option value="" disabled selected></option>
                        <option value="0">0</option>
                        <option value="0.5">0.5</option>
                        <option value="1">1</option>
                        <option value="1.5">1.5</option>
                        <option value="2">2</option>
                        <option value="2.5">2.5</option>
                        <option value="3">3</option>
                        <option value="3.5">3.5</option>
                        <option value="4">4</option>
                        <option value="4.5">4.5</option>
                        <option value="5">5</option>
                    </select>
                </div>

                <div class="criteria-row">
                    <label>Flüssigkeit (F):</label>
                    <select id="critF" class="score-select" required>
                        <option value="" disabled selected></option>
                        <option value="0">0</option>
                        <option value="0.5">0.5</option>
                        <option value="1">1</option>
                        <option value="1.5">1.5</option>
                        <option value="2">2</option>
                        <option value="2.5">2.5</option>
                        <option value="3">3</option>
                        <option value="3.5">3.5</option>
                        <option value="4">4</option>
                        <option value="4.5">4.5</option>
                        <option value="5">5</option>
                    </select>
                </div>

                <div class="criteria-row">
                    <label>Korrektheit (K):</label>
                    <select id="critK" class="score-select" required>
                        <option value="" disabled selected></option>
                        <option value="0">0</option>
                        <option value="0.5">0.5</option>
                        <option value="1">1</option>
                        <option value="1.5">1.5</option>
                        <option value="2">2</option>
                        <option value="2.5">2.5</option>
                        <option value="3">3</option>
                        <option value="3.5">3.5</option>
                        <option value="4">4</option>
                        <option value="4.5">4.5</option>
                        <option value="5">5</option>
                    </select>
                </div>

                <div class="total-box" id="totalBox">
                    Gesamtpunkte (Total): <span id="totalScore">0</span> / 25
                </div>
            </div>

            <div class="form-group">
                <label for="feedback">Feedback & Notizen (Zoom-Link):</label>
                <textarea id="feedback" rows="3" required></textarea>
            </div>

            <div class="form-group">
                <label for="statusResult">Ergebnis:</label>
                <select id="statusResult" required>
                    <option value="" disabled selected></option>
                    <option value="Bestanden">Bestanden</option>
                    <option value="Nicht">Nicht</option>
                </select>
            </div>

            <div class="form-group">
                <label for="retakeRequired">Wiederholung erforderlich?</label>
                <select id="retakeRequired" required>
                    <option value="" disabled selected></option>
                    <option value="Nein">Nein</option>
                    <option value="Ja">Ja</option>
                </select>
            </div>

            <div class="form-group" id="recommendedLevelGroup" style="display: none;">
                <label for="recommendedLevel">Empfohlenes Niveau (المستوى المرشح للطالب):</label>
                <select id="recommendedLevel">
                    <option value="" disabled selected></option>
                    <option value="A1.1">A1.1</option>
                    <option value="A1.2">A1.2</option>
                    <option value="A2.1">A2.1</option>
                    <option value="A2.2">A2.2</option>
                    <option value="B1.1">B1.1</option>
                    <option value="B1.2">B1.2</option>
                    <option value="B2.1">B2.1</option>
                    <option value="B2.2">B2.2</option>
                    <option value="C1.1">C1.1</option>
                    <option value="C1.2">C1.2</option>
                    <option value="C2.1">C2.1</option>
                    <option value="C2.2">C2.2</option>
                    <option value="Konv Nach A2">Konv Nach A2</option>
                    <option value="Konv Nach B1">Konv Nach B1</option>
                    <option value="Konv Nach B2">Konv Nach B2</option>
                    <option value="Beratung A1">Beratung A1</option>
                    <option value="Beratung A2">Beratung A2</option>
                    <option value="Beratung B1">Beratung B1</option>
                    <option value="Beratung B2">Beratung B2</option>
                    <option value="Beratung C1">Beratung C1</option>
                    <option value="Beratung C2">Beratung C2</option>
                </select>
            </div>

            <div class="form-group">
                <label for="notes">Bemerkungen (Allgemein):</label>
                <textarea id="notes" rows="2"></textarea>
            </div>

            <div style="margin-top: 30px; text-align: center;">
                <button type="submit" id="submitBtn" class="btn btn-success" style="width: 100%; padding: 15px; font-size: 18px;" disabled>🎙️ برجاء إتمام التسجيل الصوتي أولاً للإرسال</button>
            </div>
            <p id="statusMessage"></p>
        </form>
    </div>

    <script>
        const scoreSelects = document.querySelectorAll('.score-select');
        const totalScoreDisplay = document.getElementById('totalScore');
        const totalBox = document.getElementById('totalBox');
        const examTypeSelect = document.getElementById('examType');
        const recommendedLevelGroup = document.getElementById('recommendedLevelGroup');
        const recommendedLevelSelect = document.getElementById('recommendedLevel');

        function toggleRecommendedLevel() {
            if (examTypeSelect.value === "Einstufungstest") {
                recommendedLevelGroup.style.display = "block";
                recommendedLevelSelect.required = true;
            } else {
                recommendedLevelGroup.style.display = "none";
                recommendedLevelSelect.required = false;
                recommendedLevelSelect.value = "";
            }
        }

        examTypeSelect.addEventListener('change', toggleRecommendedLevel);

        function updateTotalBoxColor(total) {
            totalBox.classList.remove("score-pass", "score-fail");
            if (total >= 15) {
                totalBox.classList.add("score-pass");
            } else if (total >= 0.5 && total < 15) {
                totalBox.classList.add("score-fail");
            }
        }

        function calculateTotal() {
            let total = 0;
            scoreSelects.forEach(select => {
                total += parseFloat(select.value) || 0;
            });
            const formattedTotal = Number(total.toFixed(1));
            totalScoreDisplay.textContent = formattedTotal;
            updateTotalBoxColor(formattedTotal);
        }

        scoreSelects.forEach(select => {
            select.addEventListener('change', calculateTotal);
        });

        let mediaRecorder;
        let audioChunks = [];
        let timerInterval = null;
        let seconds = 0;
        let base64Audio = "";
        let audioStream = null;
        let displayStream = null;
        let micStream = null;

        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const stopBtn = document.getElementById('stopBtn');
        const submitBtn = document.getElementById('submitBtn');
        const timerDisplay = document.getElementById('timer');
        const examForm = document.getElementById('examForm');
        const statusMessage = document.getElementById('statusMessage');

        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                seconds++;
                let mins = Math.floor(seconds / 60).toString().padStart(2, '0');
                let secs = (seconds % 60).toString().padStart(2, '0');
                timerDisplay.textContent = `${mins}:${secs}`;
            }, 1000);
        }

        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        startBtn.addEventListener('click', async () => {
            try {
                displayStream = null;
                micStream = null;

                micStream = await navigator.mediaDevices.getUserMedia({ 
                    audio: { echoCancellation: true, noiseSuppression: true } 
                });

                const audioContext = new AudioContext();
                const dest = audioContext.createMediaStreamDestination();

                if (micStream && micStream.getAudioTracks().length > 0) {
                    const micSource = audioContext.createMediaStreamSource(micStream);
                    micSource.connect(dest);
                }

                let hasSystemAudio = false;
                if (navigator.mediaDevices && typeof navigator.mediaDevices.getDisplayMedia === 'function') {
                    try {
                        displayStream = await navigator.mediaDevices.getDisplayMedia({ 
                            video: true, 
                            audio: { suppressLocalAudioPlayback: false, echoCancellation: true, noiseSuppression: true }
                        });
                        if (displayStream && displayStream.getAudioTracks().length > 0) {
                            const displaySource = audioContext.createMediaStreamSource(new MediaStream([displayStream.getAudioTracks()[0]]));
                            displaySource.connect(dest);
                            hasSystemAudio = true;
                        }
                        if (displayStream) {
                            displayStream.getVideoTracks().forEach(track => track.stop());
                        }
                    } catch (displayErr) {
                        displayStream = null;
                        hasSystemAudio = false;
                    }
                }

                audioStream = dest.stream;
                mediaRecorder = new MediaRecorder(audioStream);
                audioChunks = [];

                mediaRecorder.ondataavailable = event => {
                    if (event.data.size > 0) {
                        audioChunks.push(event.data);
                    }
                };

                mediaRecorder.onstop = () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    const reader = new FileReader();
                    reader.readAsDataURL(audioBlob);
                    reader.onloadend = () => {
                        base64Audio = reader.result;
                        submitBtn.disabled = false;
                        submitBtn.textContent = "Daten und Aufnahme senden 🚀";
                        statusMessage.textContent = "Aufnahme gestoppt und bereit zum Senden! ✅";
                        statusMessage.style.color = "#10b981";
                    };
                };

                mediaRecorder.start();
                startBtn.disabled = true;
                pauseBtn.disabled = false;
                stopBtn.disabled = false;
                submitBtn.disabled = true;
                pauseBtn.textContent = "⏸️ Pause";
                
                seconds = 0;
                startTimer();

                statusMessage.textContent = hasSystemAudio
                    ? "Aufnahme läuft (Lehrer + Online-Audio)..."
                    : "Aufnahme läuft (Mikrofon)...";
                statusMessage.style.color = "#ea580c";

            } catch (err) {
                alert("Bitte erteilen Sie die Berechtigungen für das Mikrofon, um die Aufnahme zu starten.");
            }
        });

        pauseBtn.addEventListener('click', () => {
            if (mediaRecorder.state === "recording") {
                mediaRecorder.pause();
                stopTimer();
                pauseBtn.textContent = "▶️ Fortsetzen";
                statusMessage.textContent = "Aufnahme pausiert.";
                statusMessage.style.color = "#f59e0b";
            } else if (mediaRecorder.state === "paused") {
                mediaRecorder.resume();
                startTimer();
                pauseBtn.textContent = "⏸️ Pause";
                statusMessage.textContent = "Aufnahme läuft...";
                statusMessage.style.color = "#ea580c";
            }
        });

        stopBtn.addEventListener('click', () => {
            stopTimer();
            if (mediaRecorder && mediaRecorder.state !== "inactive") {
                mediaRecorder.stop();
            }
            if (micStream) {
                micStream.getTracks().forEach(track => track.stop());
            }
            if (displayStream) {
                displayStream.getTracks().forEach(track => track.stop());
            }
            startBtn.disabled = false;
            pauseBtn.disabled = true;
            stopBtn.disabled = true;
            pauseBtn.textContent = "⏸️ Pause";
            statusMessage.textContent = "Wird verarbeitet...";
        });

        examForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const textInputs = [
                document.getElementById('fullName'),
                document.getElementById('idNumber'),
                document.getElementById('instructor'),
                document.getElementById('feedback')
            ];

            for (let input of textInputs) {
                if (!input.value.trim()) {
                    input.focus();
                    statusMessage.textContent = "يرجى ملء جميع الخانات المطلوبة قبل الإرسال! ⚠️";
                    statusMessage.style.color = "#ef4444";
                    return;
                }
            }

            if (examTypeSelect.value === "Einstufungstest" && !recommendedLevelSelect.value) {
                recommendedLevelSelect.focus();
                statusMessage.textContent = "يرجى اختيار المستوى المرشح للطالب (Empfohlenes Niveau)! ⚠️";
                statusMessage.style.color = "#ef4444";
                return;
            }

            if (!base64Audio || !base64Audio.startsWith("data:audio")) {
                statusMessage.textContent = "يرجى إتمام التسجيل الصوتي أولاً قبل الإرسال! ⚠️";
                statusMessage.style.color = "#ef4444";
                return;
            }

            submitBtn.disabled = true;
            statusMessage.textContent = "Daten und Audioaufnahme werden gesendet...";
            statusMessage.style.color = "#ea580c";

            const formData = {
                fullName: document.getElementById('fullName').value.trim(),
                idNumber: document.getElementById('idNumber').value.trim(),
                examType: document.getElementById('examType').value,
                examMode: document.getElementById('examMode').value,
                examAttempt: document.getElementById('examAttempt').value,
                examDate: document.getElementById('examDate').value,
                instructor: document.getElementById('instructor').value.trim(),
                examLevel: document.getElementById('examLevel').value,
                critE: document.getElementById('critE').value,
                critWR: document.getElementById('critWR').value,
                critA: document.getElementById('critA').value,
                critF: document.getElementById('critF').value,
                critK: document.getElementById('critK').value,
                totalScore: totalScoreDisplay.textContent,
                feedback: document.getElementById('feedback').value.trim(),
                statusResult: document.getElementById('statusResult').value,
                retakeRequired: document.getElementById('retakeRequired').value,
                recommendedLevel: examTypeSelect.value === "Einstufungstest" ? recommendedLevelSelect.value : "",
                notes: document.getElementById('notes').value.trim(),
                audioData: base64Audio
            };

            const scriptURL = "https://script.google.com/macros/s/AKfycbxFwZ644xngdn39yddqGWHiT8EDde3Uq8cYSTgTyEDedc4k-atcxeZ89BS9rmeo4kv1/exec";

            try {
                await fetch(scriptURL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });

                statusMessage.textContent = "Daten und Aufnahme erfolgreich gesendet! ✅";
                statusMessage.style.color = "#10b981";
                examForm.reset();
                toggleRecommendedLevel();
                timerDisplay.textContent = "00:00";
                calculateTotal();
                base64Audio = "";
                submitBtn.disabled = true;
                submitBtn.textContent = "🎙️ برجاء إتمام التسجيل الصوتي أولاً للإرسال";
            } catch (error) {
                statusMessage.textContent = "Fehler beim Senden. Bitte versuchen Sie es erneut.";
                statusMessage.style.color = "#ef4444";
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
