<!DOCTYPE html>
<html lang="de" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kapitel Eins Sprachakademie - Prüfungsportal</title>
    <style>
        :root {
            --primary-color: #ea580c;
            --secondary-color: #c2410c;
            --text-color: #1e293b;
            --bg-gradient: linear-gradient(135deg, #f97316 0%, #ea580c 50%, #c2410c 100%);
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            position: relative;
            background: var(--bg-gradient);
        }
        body::before {
            content: "Kapitel Eins Sprachakademie";
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-25deg);
            font-size: 8vw;
            font-weight: 900;
            color: rgba(255, 255, 255, 0.12);
            white-space: nowrap;
            z-index: 0;
            pointer-events: none;
        }
        .container {
            width: 100%;
            max-width: 750px;
            background: #ffffff;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            position: relative;
            z-index: 1;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 20px;
        }
        .header h1 {
            color: var(--primary-color);
            font-size: 26px;
            margin: 0 0 10px 0;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: var(--text-color);
        }
        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
        }
        .criteria-box {
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            padding: 20px;
            border-radius: 12px;
            margin-top: 25px;
            margin-bottom: 25px;
        }
        .criteria-box h3 {
            margin-top: 0;
            color: var(--primary-color);
            font-size: 18px;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 10px;
        }
        .criteria-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .criteria-row label {
            margin-bottom: 0;
            font-weight: normal;
            font-size: 14px;
            flex: 2;
        }
        .criteria-row select {
            flex: 1;
            padding: 8px;
        }
        .total-box {
            background: #fff7ed;
            border: 2px solid var(--primary-color);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
            color: var(--secondary-color);
            font-size: 18px;
        }
        .recorder-section {
            background: #f8fafc;
            border: 2px dashed #cbd5e1;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            margin-top: 25px;
        }
        .btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            margin: 5px;
            font-weight: bold;
            transition: background 0.3s;
        }
        .btn:hover { background: var(--secondary-color); }
        .btn-danger { background: #ef4444; }
        .btn-danger:hover { background: #dc2626; }
        .btn-success { background: #10b981; }
        .btn-success:hover { background: #059669; }
        #audioElement { display: none; }
        #statusMessage {
            margin-top: 15px;
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Kapitel Eins Sprachakademie</h1>
            <p>Prüfungsanmeldung & Mündliche Prüfung</p>
        </div>

        <form id="examForm">
            <div class="form-group">
                <label for="fullName">Vollständiger Name:</label>
                <input type="text" id="fullName" required placeholder="Vollständigen Namen eingeben...">
            </div>

            <div class="form-group">
                <label for="idNumber">ID / Nummer:</label>
                <input type="text" id="idNumber" placeholder="ID oder Nummer eingeben...">
            </div>

            <div class="form-group">
                <label for="examDate">Prüfungsdatum:</label>
                <input type="date" id="examDate">
            </div>

            <div class="form-group">
                <label for="instructor">Prüfer / Instructor:</label>
                <input type="text" id="instructor" placeholder="Name des Prüfers...">
            </div>

            <div class="form-group">
                <label for="examLevel">Prüfungsniveau:</label>
                <select id="examLevel">
                    <option value="A1">Start Deutsch A1</option>
                    <option value="A2">Zertifikat A2</option>
                    <option value="B1">Zertifikat B1</option>
                    <option value="B2">Zertifikat B2</option>
                </select>
            </div>

            <div class="criteria-box">
                <h3>Bewertungskriterien (1 bis 5)</h3>
                <div class="criteria-row">
                    <label>Erfüllung (E):</label>
                    <select id="critE" class="score-select">
                        <option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option>
                    </select>
                </div>
                <div class="criteria-row">
                    <label>Wortschatz und Redemittel (W/R):</label>
                    <select id="critWR" class="score-select">
                        <option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option>
                    </select>
                </div>
                <div class="criteria-row">
                    <label>Aussprache (A):</label>
                    <select id="critA" class="score-select">
                        <option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option>
                    </select>
                </div>
                <div class="criteria-row">
                    <label>Flüssigkeit (F):</label>
                    <select id="critF" class="score-select">
                        <option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option>
                    </select>
                </div>
                <div class="criteria-row">
                    <label>Korrektheit (K):</label>
                    <select id="critK" class="score-select">
                        <option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option>
                    </select>
                </div>
                <div class="total-box">
                    Gesamtpunkte (Total): <span id="totalScore">5</span> / 25
                </div>
            </div>

            <div class="form-group">
                <label for="grades">Noten / Punkte:</label>
                <input type="text" id="grades" placeholder="Note eingeben...">
            </div>

            <div class="form-group">
                <label for="statusResult">Ergebnis:</label>
                <select id="statusResult">
                    <option value="Bestanden">Bestanden</option>
                    <option value="Nicht Bestanden">Nicht Bestanden</option>
                </select>
            </div>

            <div class="form-group">
                <label for="retakeRequired">Wiederholung erforderlich?</label>
                <select id="retakeRequired">
                    <option value="Nein">Nein</option>
                    <option value="Ja">Ja</option>
                </select>
            </div>

            <div class="form-group">
                <label for="notes">Bemerkungen:</label>
                <textarea id="notes" rows="3" placeholder="Zusätzliche Bemerkungen..."></textarea>
            </div>

            <div class="recorder-section">
                <label>Mündliche Prüfung (Audioaufnahme):</label>
                <button type="button" id="startBtn" class="btn">🎙️ Aufnahme starten</button>
                <button type="button" id="stopBtn" class="btn btn-danger" disabled>⏹️ Aufnahme stoppen</button>
                <p id="timer" style="margin-top: 10px; font-weight: bold; color: #64748b;">00:00</p>
                <audio id="audioElement" controls></audio>
            </div>

            <div style="margin-top: 30px; text-align: center;">
                <button type="submit" class="btn btn-success" style="width: 100%; padding: 15px; font-size: 18px;">Daten und Aufnahme senden 🚀</button>
            </div>
            <p id="statusMessage"></p>
        </form>
    </div>

    <script>
        const scoreSelects = document.querySelectorAll('.score-select');
        const totalScoreDisplay = document.getElementById('totalScore');

        function calculateTotal() {
            let total = 0;
            scoreSelects.forEach(select => {
                total += parseInt(select.value) || 0;
            });
            totalScoreDisplay.textContent = total;
        }

        scoreSelects.forEach(select => {
            select.addEventListener('change', calculateTotal);
        });

        let mediaRecorder;
        let audioChunks = [];
        let timerInterval;
        let seconds = 0;
        let base64Audio = "";
        let audioStream = null;

        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const audioElement = document.getElementById('audioElement');
        const timerDisplay = document.getElementById('timer');
        const examForm = document.getElementById('examForm');
        const statusMessage = document.getElementById('statusMessage');

        startBtn.addEventListener('click', async () => {
            try {
                audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(audioStream);
                audioChunks = [];

                mediaRecorder.ondataavailable = event => {
                    if (event.data.size > 0) {
                        audioChunks.push(event.data);
                    }
                };

                mediaRecorder.onstop = () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/mp3' });
                    const reader = new FileReader();
                    reader.readAsDataURL(audioBlob);
                    reader.onloadend = () => {
                        base64Audio = reader.result;
                    };
                };

                mediaRecorder.start();
                startBtn.disabled = true;
                stopBtn.disabled = false;
                
                seconds = 0;
                timerInterval = setInterval(() => {
                    seconds++;
                    let mins = Math.floor(seconds / 60).toString().padStart(2, '0');
                    let secs = (seconds % 60).toString().padStart(2, '0');
                    timerDisplay.textContent = `${mins}:${secs}`;
                }, 1000);

                statusMessage.textContent = "Aufnahme läuft...";
                statusMessage.style.color = "#ea580c";
            } catch (err) {
                alert("Bitte erlauben Sie den Zugriff على das Mikrofon.");
            }
        });

        stopBtn.addEventListener('click', () => {
            if (mediaRecorder && mediaRecorder.state !== "inactive") {
                mediaRecorder.stop();
            }
            if (audioStream) {
                audioStream.getTracks().forEach(track => track.stop());
            }
            clearInterval(timerInterval);
            startBtn.disabled = false;
            stopBtn.disabled = true;
            statusMessage.textContent = "Aufnahme gestoppt und bereit zum Senden!";
            statusMessage.style.color = "#10b981";
        });

        examForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            statusMessage.textContent = "Daten und Audioaufnahme werden gesendet...";
            statusMessage.style.color = "#ea580c";

            const formData = {
                fullName: document.getElementById('fullName').value,
                idNumber: document.getElementById('idNumber').value,
                examDate: document.getElementById('examDate').value,
                instructor: document.getElementById('instructor').value,
                examLevel: document.getElementById('examLevel').value,
                critE: document.getElementById('critE').value,
                critWR: document.getElementById('critWR').value,
                critA: document.getElementById('critA').value,
                critF: document.getElementById('critF').value,
                critK: document.getElementById('critK').value,
                totalScore: totalScoreDisplay.textContent,
                grades: document.getElementById('grades').value,
                statusResult: document.getElementById('statusResult').value,
                retakeRequired: document.getElementById('retakeRequired').value,
                notes: document.getElementById('notes').value,
                audioData: base64Audio
            };

            const scriptURL = "https://script.google.com/macros/s/AKfycbw7gIwnS8cRGFHlHRNlqwTMx0IUzbG3SbDV9bbGmbD6fq_X5Ihft97333132Mn-nCZN/exec";

            try {
                const response = await fetch(scriptURL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });

                statusMessage.textContent = "Daten und Aufnahme erfolgreich gesendet! ✅";
                statusMessage.style.color = "#10b981";
                examForm.reset();
                timerDisplay.textContent = "00:00";
                calculateTotal();
                base64Audio = "";
            } catch (error) {
                statusMessage.textContent = "Fehler beim Senden. Bitte versuchen Sie es erneut.";
                statusMessage.style.color = "#ef4444";
            }
        });
    </script>
</body>
</html>
