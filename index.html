<!DOCTYPE html>
<html lang="de" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kapitel Eins Sprachakademie - Prüfungsportal</title>
    <style>
        :root {
            --primary-color: #ea580c;
            --secondary-color: #c2410c;
            --text-color: #1e293b;
            --bg-gradient: linear-gradient(135deg, #f97316 0%, #ea580c 50%, #c2410c 100%);
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            position: relative;
            background: var(--bg-gradient);
        }
        body::before {
            content: "Kapitel Eins Sprachakademie";
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-25deg);
            font-size: 8vw;
            font-weight: 900;
            color: rgba(255, 255, 255, 0.12);
            white-space: nowrap;
            z-index: 0;
            pointer-events: none;
        }
        .container {
            width: 100%;
            max-width: 750px;
            background: #ffffff;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            position: relative;
            z-index: 1;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 20px;
        }
        .header h1 {
            color: var(--primary-color);
            font-size: 26px;
            margin: 0 0 10px 0;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: var(--text-color);
        }
        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
        }
        .recorder-section {
            background: #f8fafc;
            border: 2px dashed #cbd5e1;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            margin-top: 25px;
        }
        .btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            margin: 5px;
            font-weight: bold;
            transition: background 0.3s;
        }
        .btn:hover { background: var(--secondary-color); }
        .btn-danger { background: #ef4444; }
        .btn-danger:hover { background: #dc2626; }
        .btn-success { background: #10b981; }
        .btn-success:hover { background: #059669; }
        #audioElement { display: none; }
        #statusMessage {
            margin-top: 15px;
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Kapitel Eins Sprachakademie</h1>
            <p>Prüfungsanmeldung & Mündliche Prüfung</p>
        </div>

        <form id="examForm">
            <div class="form-group">
                <label for="fullName">Vollständiger Name (الاسم الكامل):</label>
                <input type="text" id="fullName" required placeholder="أدخل اسم الطالب...">
            </div>

            <div class="form-group">
                <label for="idNumber">ID / Nummer (الرقم التعريفي):</label>
                <input type="text" id="idNumber" placeholder="أدخل الرقم...">
            </div>

            <div class="form-group">
                <label for="examDate">Exam Date (تاريخ الاختبار):</label>
                <input type="date" id="examDate">
            </div>

            <div class="form-group">
                <label for="instructor">Instructor (الإنستراكتور / المحاضر):</label>
                <input type="text" id="instructor" placeholder="اسم المحاضر...">
            </div>

            <div class="form-group">
                <label for="examLevel">Exam Level (مستوى الاختبار):</label>
                <select id="examLevel">
                    <option value="A1">Start Deutsch A1</option>
                    <option value="A2">Zertifikat A2</option>
                    <option value="B1">Zertifikat B1</option>
                    <option value="B2">Zertifikat B2</option>
                </select>
            </div>

            <div class="form-group">
                <label for="grades">Grades (الدرجات):</label>
                <input type="text" id="grades" placeholder="أدخل الدرجة أو التقييم...">
            </div>

            <div class="form-group">
                <label for="notes">Notes (ملاحظات):</label>
                <textarea id="notes" rows="3" placeholder="أي ملاحظات إضافية..."></textarea>
            </div>

            <div class="recorder-section">
                <label>تسجيل الاختبار الشفوي (Mündliche Prüfung):</label>
                <button type="button" id="startBtn" class="btn">🎙️ بدء التسجيل</button>
                <button type="button" id="stopBtn" class="btn btn-danger" disabled>⏹️ إيقاف التسجيل</button>
                <p id="timer" style="margin-top: 10px; font-weight: bold; color: #64748b;">00:00</p>
                <audio id="audioElement" controls></audio>
            </div>

            <div style="margin-top: 30px; text-align: center;">
                <button type="submit" class="btn btn-success" style="width: 100%; padding: 15px; font-size: 18px;">إرسال البيانات والتسجيل إلى الشيت والدرايف 🚀</button>
            </div>
            <p id="statusMessage"></p>
        </form>
    </div>

    <script>
        let mediaRecorder;
        let audioChunks = [];
        let timerInterval;
        let seconds = 0;
        let base64Audio = "";

        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const audioElement = document.getElementById('audioElement');
        const timerDisplay = document.getElementById('timer');
        const examForm = document.getElementById('examForm');
        const statusMessage = document.getElementById('statusMessage');

        startBtn.addEventListener('click', async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];

                mediaRecorder.ondataavailable = event => {
                    audioChunks.push(event.data);
                };

                mediaRecorder.onstop = () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/mp3' });
                    const reader = new FileReader();
                    reader.readAsDataURL(audioBlob);
                    reader.onloadend = () => {
                        base64Audio = reader.result; // تحويل الملف لصيغة تناسب الإرسال للسيرفر
                    };
                };

                mediaRecorder.start();
                startBtn.disabled = true;
                stopBtn.disabled = false;
                
                seconds = 0;
                timerInterval = setInterval(() => {
                    seconds++;
                    let mins = Math.floor(seconds / 60).toString().padStart(2, '0');
                    let secs = (seconds % 60).toString().padStart(2, '0');
                    timerDisplay.textContent = `${mins}:${secs}`;
                }, 1000);

                statusMessage.textContent = "جاري التسجيل الان...";
                statusMessage.style.color = "#ea580c";
            } catch (err) {
                alert("يرجى السماح للمتصفح بالوصول إلى الميكروفون.");
            }
        });

        stopBtn.addEventListener('click', () => {
            if (mediaRecorder && mediaRecorder.state !== "inactive") {
                mediaRecorder.stop();
                mediaRecorder.stream.getTracks().forEach(track => track.stop());
            }
            clearInterval(timerInterval);
            startBtn.disabled = false;
            stopBtn.disabled = true;
            statusMessage.textContent = "تم إيقاف التسجيل بنجاح وجاهز للإرسال!";
            statusMessage.style.color = "#10b981";
        });

        examForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            statusMessage.textContent = "جاري رفع البيانات والتسجيل الصوتي إلى Google Drive & Sheet...";
            statusMessage.style.color = "#ea580c";

            const formData = {
                fullName: document.getElementById('fullName').value,
                idNumber: document.getElementById('idNumber').value,
                examDate: document.getElementById('examDate').value,
                instructor: document.getElementById('instructor').value,
                examLevel: document.getElementById('examLevel').value,
                grades: document.getElementById('grades').value,
                notes: document.getElementById('notes').value,
                audioData: base64Audio
            };

            const scriptURL = "https://script.google.com/macros/s/AKfycbw7gIwnS8cRGFHlHRNlqwTMx0IUzbG3SbDV9bbGmbD6fq_X5Ihft97333132Mn-nCZN/exec";

            try {
                const response = await fetch(scriptURL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });

                statusMessage.textContent = "تم إرسال البيانات وحفظ التسجيل بنجاح تام! ✅";
                statusMessage.style.color = "#10b981";
                examForm.reset();
                timerDisplay.textContent = "00:00";
                base64Audio = "";
            } catch (error) {
                statusMessage.textContent = "حدث خطأ أثناء الإرسال، يرجى المحاولة مرة أخرى.";
                statusMessage.style.color = "#ef4444";
            }
        });
    </script>
</body>
</html>
