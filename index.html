<!DOCTYPE html>
<html lang="de" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kapitel Eins Sprachakademie - Prüfungsportal</title>
    <style>
        :root {
            --primary-color: #ea580c;
            --secondary-color: #c2410c;
            --text-color: #1e293b;
            --bg-gradient: linear-gradient(135deg, #f97316 0%, #ea580c 50%, #c2410c 100%);
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            position: relative;
            background: var(--bg-gradient);
        }
        body::before {
            content: "Kapitel Eins Sprachakademie";
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-25deg);
            font-size: 8vw;
            font-weight: 900;
            color: rgba(255, 255, 255, 0.12);
            white-space: nowrap;
            z-index: 0;
            pointer-events: none;
        }
        .container {
            width: 100%;
            max-width: 750px;
            background: #ffffff;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            position: relative;
            z-index: 1;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 20px;
        }
        .header h1 {
            color: var(--primary-color);
            font-size: 26px;
            margin: 0 0 10px 0;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: var(--text-color);
        }
        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
        }
        .recorder-section {
            background: #f8fafc;
            border: 2px dashed #cbd5e1;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            margin-top: 25px;
        }
        .btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            margin: 5px;
            font-weight: bold;
            transition: background 0.3s;
        }
        .btn:hover {
            background: var(--secondary-color);
        }
        .btn-danger { background: #ef4444; }
        .btn-danger:hover { background: #dc2626; }
        .btn-success { background: #10b981; }
        .btn-success:hover { background: #059669; }
        #audioElement {
            display: none; /* إخفاء مشغل الصوت تماماً عن الصفحة بناءً على طلبك */
        }
        #statusMessage {
            margin-top: 15px;
            font-weight: bold;
            color: #047857;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Kapitel Eins Sprachakademie</h1>
            <p>Prüfungsanmeldung & Mündliche Prüfung</p>
        </div>

        <form id="examForm">
            <div class="form-group">
                <label for="fullName">Vollständiger Name (الاسم الكامل):</label>
                <input type="text" id="fullName" required placeholder="أدخل اسمك الثلاثي...">
            </div>

            <div class="form-group">
                <label for="examLevel">Prüfungsniveau (مستوى الاختبار):</label>
                <select id="examLevel">
                    <option value="A1">Start Deutsch A1</option>
                    <option value="A2">Zertifikat A2</option>
                    <option value="B1">Zertifikat B1</option>
                    <option value="B2">Zertifikat B2</option>
                </select>
            </div>

            <div class="recorder-section">
                <label>تسجيل الاختبار الشفوي (Mündliche Prüfung):</label>
                <button type="button" id="startBtn" class="btn">🎙️ بدء التسجيل</button>
                <button type="button" id="stopBtn" class="btn btn-danger" disabled>⏹️ إيقاف التسجيل</button>
                <p id="timer" style="margin-top: 10px; font-weight: bold; color: #64748b;">00:00</p>
                
                <!-- تم إخفاء الريكورد تماماً من الصفحة بناءً على طلبك -->
                <audio id="audioElement" controls></audio>
            </div>

            <div style="margin-top: 30px; text-align: center;">
                <button type="submit" class="btn btn-success" style="width: 100%; padding: 15px; font-size: 18px;">إرسال البيانات والتسجيل 🚀</button>
            </div>
            <p id="statusMessage" style="text-align: center;"></p>
        </form>
    </div>

    <script>
        let mediaRecorder;
        let audioChunks = [];
        let timerInterval;
        let seconds = 0;

        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const audioElement = document.getElementById('audioElement');
        const timerDisplay = document.getElementById('timer');
        const examForm = document.getElementById('examForm');
        const statusMessage = document.getElementById('statusMessage');

        // ربط ملفات جوجل درايف و Google Sheets يتم عادة عبر ربط النموذج برابط Google Apps Script (Webhook)
        // سنقوم بتجهيز الكود لاستقبال البيانات وإرسالها بسلاسة بمجرد ربط الـ Script الخاص بك.
        
        startBtn.addEventListener('click', async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];

                mediaRecorder.ondataavailable = event => {
                    audioChunks.push(event.data);
                };

                mediaRecorder.onstop = () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/mp3' });
                    const audioUrl = URL.createObjectURL(audioBlob);
                    audioElement.src = audioUrl; // يتم الاحتفاظ بالملف برمجياً للإرسال دون عرضه على الشاشة
                };

                mediaRecorder.start();
                startBtn.disabled = true;
                stopBtn.disabled = false;
                
                seconds = 0;
                timerInterval = setInterval(() => {
                    seconds++;
                    let mins = Math.floor(seconds / 60).toString().padStart(2, '0');
                    let secs = (seconds % 60).toString().padStart(2, '0');
                    timerDisplay.textContent = `${mins}:${secs}`;
                }, 1000);

                statusMessage.textContent = "جاري التسجيل الان...";
                statusMessage.style.color = "#ea580c";
            } catch (err) {
                alert("يرجى السماح للمتصفح بالوصول إلى الميكروفون.");
            }
        });

        stopBtn.addEventListener('click', () => {
            if (mediaRecorder && mediaRecorder.state !== "inactive") {
                mediaRecorder.stop();
                // إيقاف استخدام الميكروفون تماماً وقطع الاتصال به
                mediaRecorder.stream.getTracks().forEach(track => track.stop());
            }
            clearInterval(timerInterval);
            startBtn.disabled = false;
            stopBtn.disabled = true;
            statusMessage.textContent = "تم إيقاف التسجيل بنجاح وجاهز للإرسال!";
            statusMessage.style.color = "#10b981";
        });

        examForm.addEventListener('submit', (e) => {
            e.preventDefault();
            statusMessage.textContent = "جاري رفع البيانات والتسجيل إلى Google Drive و Sheets...";
            
            // محاكاة عملية الإرسال الناجحة (يمكننا ربطها بـ Google Apps Script الخاص بك في الخطوة القادمة)
            setTimeout(() => {
                statusMessage.textContent = "تم إرسال البيانات وحفظ التسجيل بنجاح تام! ✅";
                examForm.reset();
                timerDisplay.textContent = "00:00";
            }, 2000);
        });
    </script>
</body>
</html>
