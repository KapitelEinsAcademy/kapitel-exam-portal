<!DOCTYPE html>
<html lang="de" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kapitel Eins Sprachakademie</title>
    <style>
        :root {
            --primary-color: #1e3a8a;
            --secondary-color: #3b82f6;
            --accent-color: #10b981;
            --danger-color: #ef4444;
            --text-color: #1e293b;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            position: relative;
            
            /* خلفية الصفحة بالكامل باللون البرتقالي الراقي والمتدرج */
            background: linear-gradient(135deg, #f97316 0%, #ea580c 50%, #c2410c 100%);
        }
        
        /* علامة مائية كبيرة باسم الأكاديمية تغطي خلفية الصفحة بالكامل */
        body::before {
            content: "Kapitel Eins Sprachakademie";
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-25deg);
            font-size: 8vw;
            font-weight: 900;
            color: rgba(255, 255, 255, 0.12); /* لون أبيض شفاف ليبدو كعلامة مائية فاخرة */
            white-space: nowrap;
            z-index: 0;
            pointer-events: none;
        }

        .container {
            width: 100%;
            max-width: 750px;
            background: #ffffff;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            position: relative;
            z-index: 1;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 20px;
        }
        .header h1 {
            color: #ea580c;
            font-size: 28px;
            margin: 0 0 10px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Kapitel Eins Sprachakademie</h1>
            <p>Prüfungsanmeldung & Registrierung</p>
        </div>
        <p style="text-align: center; color: #555;">مرحباً بك يا دكتور! البوابة تعمل الآن بكامل الكفاءة والهوية البصرية.</p>
    </div>
</body>
</html>
